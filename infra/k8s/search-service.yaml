apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels: { app: discoveryhub, service: search-service }
spec:
  replicas: 1
  selector: { matchLabels: { service: search-service } }
  template:
    metadata: { labels: { service: search-service } }
    spec:
      containers:
        - name: search-service
          image: discoveryhub/search-service:1.0.0-SNAPSHOT
          ports: [{ containerPort: 8083 }]
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: discoveryhub-config, key: kafka.bootstrap-servers } }
            - name: SPRING_ELASTICSEARCH_URIS
              valueFrom: { configMapKeyRef: { name: discoveryhub-config, key: spring.elasticsearch.uris } }
            - name: SERVER_PORT
              value: "8083"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  selector: { service: search-service }
  ports: [{ port: 8083, targetPort: 8083 }]
