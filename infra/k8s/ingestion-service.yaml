apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  labels: { app: discoveryhub, service: ingestion-service }
spec:
  replicas: 1
  selector: { matchLabels: { service: ingestion-service } }
  template:
    metadata: { labels: { service: ingestion-service } }
    spec:
      containers:
        - name: ingestion-service
          image: discoveryhub/ingestion-service:1.0.0-SNAPSHOT
          ports: [{ containerPort: 8081 }]
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: discoveryhub-config, key: kafka.bootstrap-servers } }
            - name: SERVER_PORT
              value: "8081"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
spec:
  selector: { service: ingestion-service }
  ports: [{ port: 8081, targetPort: 8081 }]
