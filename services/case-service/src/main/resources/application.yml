server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: case-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/case_db}
    username: ${SPRING_DATASOURCE_USERNAME:discoveryhub}
    password: ${SPRING_DATASOURCE_PASSWORD:discoveryhub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.smarsh.discoveryhub: INFO
